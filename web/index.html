<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Synoptiq: Offline-first GEFSv12 rainfall forecast-bust replay research prototype" />
    <title>Synoptiq &mdash; GEFSv12 Forecast Bust Replay</title>
  </head>
  <body class="command-center-body">
    <!-- Persistent Warning Strip for Fixture Mode (Non-negotiable) -->
    <div id="fixture-ribbon" class="fixture-warning-ribbon" role="alert" aria-live="assertive">
      <div class="ribbon-inner">
        <span class="ribbon-icon">⚠️</span>
        <span class="ribbon-text"><strong>FIXTURE</strong> &mdash; illustrative integration data; not a validated model result.</span>
        <span class="ribbon-tag">LOCAL RESEARCH PROTOTYPE</span>
      </div>
    </div>

    <!-- Persistent Top Bar / Telemetry Header -->
    <header class="top-nav" role="banner">
      <div class="nav-brand">
        <div class="brand-logo" aria-hidden="true">
          <span class="brand-pulse"></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <div class="brand-titles">
          <div class="brand-name">SYNOPTIQ</div>
          <div class="brand-sub">GEFSv12 Bust Replay Engine</div>
        </div>
      </div>

      <div class="nav-telemetry">
        <div class="telemetry-pill">
          <span class="telemetry-label">ISSUE TIME</span>
          <span class="telemetry-val font-mono" id="nav-init-time">2018-08-01 00:00Z</span>
        </div>
        <div class="telemetry-pill">
          <span class="telemetry-label">ACTIVE HORIZON</span>
          <span class="telemetry-val font-mono" id="nav-lead-horizon">Lead Day 1 (+24h)</span>
        </div>
        <div class="telemetry-pill">
          <span class="telemetry-label">WINDOW SEMANTICS</span>
          <span class="telemetry-val font-mono" id="nav-window-semantics">Exact 03:00–03:00Z</span>
        </div>
      </div>

      <div class="nav-status">
        <div class="mode-badge mode-fixture" id="nav-mode-badge" role="status">
          <span class="mode-dot"></span>
          <span id="nav-mode-text">FIXTURE MODE</span>
        </div>
      </div>
    </header>

    <!-- Main Command Center Workspace: 3 Columns -->
    <main class="workspace" role="main">
      <!-- Left Column: Mission Replay Controls -->
      <aside class="dock control-dock" id="control-dock" aria-label="Replay Controls and Parameters"></aside>

      <!-- Center Column: Geospatial Visualization Surface -->
      <section class="map-surface" aria-label="Geospatial Map Replay">
        <div id="map" class="map-canvas" aria-label="Regional replay map"></div>
        <div id="map-overlay" class="map-overlay-root"></div>
      </section>

      <!-- Right Column: Regional Inspector -->
      <aside class="dock inspector-dock" id="region-panel" aria-label="Region Detail and Diagnostic Evidence"></aside>
    </main>

    <!-- Bottom Trust, Invariants and Operational Caveats Strip -->
    <footer class="trust-strip" id="trust" role="contentinfo"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
